<section class="band works" id="works" aria-labelledby="work-title">
<div class="section-head"><h2 id="work-title">Отдельные задачи.<br>Работающие решения.</h2><p>Три примера нашей работы. У каждого своя стадия готовности и границы самостоятельности системы.</p></div>
<article id="work-1c">
<div><p class="eyebrow">Производство · пилот в 1С</p><h3>Проверка служебных записок на оплату</h3><div class="work-copy"><p>Агент проверяет записку по правилам согласования и фиксирует своё решение. В реестре видно, где агент и сотрудник согласовали одну и ту же записку, а где один из них вернул её на доработку.</p><p><strong>Сейчас</strong> агент работает в теневом режиме. Решение по оплате остаётся за сотрудником. Расхождения дают материал для отладки правил перед переходом к автономной работе.</p></div></div><div class="work-visual"><div class="approval"><div class="approval-title">Проверка записки<span>Теневой режим</span></div><div class="approval-line"><span>Правила согласования</span><b>Проверяет агент</b></div><div class="approval-line"><span>Решение сотрудника</span><b>Сравниваем с агентом</b></div><div class="approval-line warn"><span>Расхождение решений</span><b>Разбираем причину</b></div><div class="approval-bottom">Решение по оплате остаётся за сотрудником</div></div><p class="visual-caption">Схема проверки · не скриншот системы</p></div></article>
<article id="work-catalog">

<div><p class="eyebrow">Подготовка предложений · работающий MVP</p><h3>Из карточки проекта в презентацию для клиента</h3><div class="work-copy"><p>В мини-CRM для event-агентства собраны заказчики, подрядчики и контакты. Система формирует презентацию для клиента. Чтобы исправить отдельный слайд, менеджер описывает правку текстом — ИИ обновляет выбранный слайд.</p></div></div><div class="work-visual"><div class="document-stack"><div class="project-sheet"><b>Карточка проекта</b><span>Заказчик</span><span>Подрядчики</span><span>Условия проекта</span></div><div class="slide-sheet"><small>Предложение клиенту</small><strong>Из данных<br>в презентацию</strong><span>Правки слайда — текстом</span></div></div><p class="visual-caption">Схема работы · действующий MVP</p></div></article>

<script>
'use strict';
const goals=[
{title:'Снизить операционные затраты',cases:[
['Объединить доставки','Два заказа в один район уходят разными машинами.','Агент сверяет адреса, загрузку и окна приёмки. Объединяет рейсы, если соблюдены все условия.','Стоимость доставки заказа при сопоставимых маршрутах и сроках.'],
['Избежать срочной закупки','Нехватку деталей замечают перед выпуском партии и платят за экспресс-доставку.','Агент сверяет спецификацию с остатками и датами поступлений. Заранее создаёт заявку на недостающие детали.','Доплаты за срочные поставки на выпущенную партию.']]},
{title:'Увеличить сумму заказа',cases:[
['Предложить старшую модель','Продавец выставляет счёт по артикулу, хотя заявленная нагрузка близка к пределу модели.','Агент сравнивает требования с каталогом и включает в предложение два подходящих варианта с разницей в цене. Выбор за клиентом.','Средний чек и валовая прибыль на сопоставимый заказ.'],
['Предложить усиленное исполнение','Для детали считают только базовое покрытие, хотя заказчик указал влажную среду.','Агент находит согласованный вариант покрытия для этих условий и добавляет в КП его стоимость и срок изготовления.','Доля заказов с улучшенным исполнением и валовая прибыль на заказ.']]},
{title:'Повысить конверсию заявок в заказы',cases:[
['Ответить, пока клиент выбирает поставщика','Менеджер выясняет, успеет ли доставить 40 фильтров в Казань к пятнице.','Агент сверяет остаток, цену клиента и дату перевозчика. Если срок подтверждён, сразу отправляет предложение.','Доля квалифицированных заявок, ставших заказами.'],
['Быстрее рассчитать типовую партию','Запрос на повторный выпуск ждёт, пока технолог и плановик подтвердят параметры.','Для утверждённой спецификации агент проверяет материалы и свободную мощность, рассчитывает срок и выпускает КП по правилам.','Доля запросов на типовые партии, дошедших до заказа.']]},
{title:'Оптимизировать ФОТ',cases:[
['Обработать больше заказов в смену','Оператор переносит позиции из писем покупателей в учётную систему.','Агент создаёт заказы по распознанным артикулам. Оператор получает только строки, требующие уточнения.','ФОТ обработки одного заказа при неизменной доле ошибок.'],
['Снять ручную подготовку сменной сводки','Мастер после смены собирает выпуск и брак из нескольких журналов.','Агент сводит записи по партиям и передаёт мастеру расхождения. После сверки формирует отчёт.','Часы подготовки сводок и оплаченные сверхурочные за месяц.']]}
];
const auditExamples=[[["Диспетчер уточняет адреса и допустимое время доставки, затем решает, можно ли менять рейс.","Закрепить в заказе адрес, окно и ограничения по грузу. Согласовать, кто разрешает перенос и при каких условиях маршрут можно менять автоматически."],["Снабженец уточняет версию спецификации у технолога, затем решает, нужна ли срочная закупка.","Связать утверждённую спецификацию с планом выпуска, остатками и сроками поставки. Назначить ответственного за изменения плана."]],[["Менеджер переводит пожелания клиента в требования и проверяет, подходит ли более дорогая модель.","Связать рабочие параметры с характеристиками каталога. Согласовать допустимые замены и ситуации, требующие инженера."],["Инженер уточняет среду эксплуатации и проверяет, допустимо ли менять исполнение детали.","Связать условия эксплуатации с утверждёнными исполнениями и себестоимостью. Новые сочетания направлять технологу."]],[["На входе менеджер выясняет, какой фильтр назван в письме. Агент может собрать черновик КП. На выходе менеджер звонит логисту и решает, можно ли обещать пятницу.","Связать обозначение клиента с артикулом, остаток — с резервами, адрес — с подтверждённым сроком перевозчика. Продажи и логистика согласуют, когда можно обещать дату, кто обновляет данные и кому передать исключение."],["На входе технолог определяет версию чертежа. На выходе плановик решает, можно ли обещать срок.","Утвердить версионность спецификаций, связать нормы с запасами и графиком загрузки. Определить, какие отклонения требуют нового расчёта."]],[["Оператор расшифровывает обозначения клиента, после загрузки сверяет созданный заказ с письмом.","Вести соответствия артикулов, проверять единицы измерения и дубли. Назначить владельца справочника и очередь неоднозначных строк."],["Мастер определяет, к какой партии относится запись, и объясняет расхождение между сменами.","Закрепить единые номера партий, правила учёта брака и время закрытия смены. Установить, кто подтверждает исправления."]]];

const industries=['Торговля','Производство'];
const summaries=['Снизить расходы на доставку и срочные поставки.','Подобрать исполнение под задачу покупателя и сохранить маржу.','Подготовить обоснованное предложение, пока клиент выбирает.','Обрабатывать больше заказов и отчётов в рамках смены.'];
const app=document.querySelector('#app');
function tile(url,title,description,label=''){
 return '<a class="tile" href="#'+url+'">'+(label?'<span class="eyebrow">'+label+'</span>':'')+'<h3>'+title+'<span aria-hidden="true">↗</span></h3><p>'+description+'</p></a>';
}
function home(){
 app.innerHTML='<section class="hero"><p class="eyebrow">Торговля и производство</p><div class="hero-top"><h1>Готовим компанию к работе с ИИ-агентами</h1><div><p class="lead">Находим, где заказ ждёт решения человека. Связываем данные и меняем правила работы, чтобы типовые задачи проходили самостоятельно.</p><a class="cta" href="#brief">Разобрать мой процесс</a><p class="hero-note">Начинаем с одного реального заказа</p></div></div><section class="journey" aria-label="Путь заказа: учебный пример" data-after="false"><div class="journey-head"><div><p class="scenario-label">Один заказ. Пять точек принятия решения.</p><h2>«40 фильтров в Казань. Успеете к пятнице?»</h2></div><div class="tabs" role="group" aria-label="Режим примера"><button type="button" aria-pressed="true">Вручную</button><button type="button" aria-pressed="false">Агент готовит черновик</button><button type="button" aria-pressed="false">Процесс перестроен</button></div></div><ol class="route-track"></ol><div class="journey-foot"><div class="reply" aria-live="polite"></div><a href="#case/2/0">Разобрать сценарий ↗</a></div><div class="audit-prompt"><p>Кто в вашей компании может пообещать клиенту срок поставки и на основании каких данных?</p><a class="cta" href="#brief/2/0">Разобрать свой заказ →</a></div></section></section><section class="band" id="goals"><div class="section-head"><h2>От бизнес-цели<br>к изменениям в процессе</h2><p>Выберите задачу. Покажем, какие данные и правила понадобятся агенту и как проверить результат.</p></div><div class="grid">'+goals.map((g,i)=>tile('goal/'+i,g.title,summaries[i])).join('')+'</div></section><section class="band audit" id="audit"><h2>С чего начинается аудит</h2><div><ol><li><b>Берём недавний заказ.</b> Прослеживаем его от запроса до результата. Отмечаем системы, ожидания и решения сотрудников.</li><li><b>Разбираем ручные решения.</b> Выясняем, кто отвечает за данные, какое правило действует и кому передают исключения.</li><li><b>Согласуем план изменений.</b> Выбираем пилот, исходный показатель, границы автономной работы и способ проверки.</li></ol><a href="#brief">Подготовить задачу для разбора →</a></div></section>';
 app.querySelector('#audit').before(document.querySelector('#portfolio').content.cloneNode(true));
 const buttons=[...app.querySelectorAll('.tabs button')];
 const stageNames=['Запрос','Подбор','Остаток','Доставка','Предложение'];
 const modes=[
  {steps:['Покупатель прислал письмо','Менеджер уточняет артикул','Сверяет остаток и резервы','Звонит логисту','Сам собирает и отправляет КП'],
   title:'Клиент ждёт, пока менеджер соберёт ответ.',
   result:'Чтобы назвать срок, нужно уточнить, какие фильтры нужны, есть ли свободные 40 штук и успеет ли машина.'},
  {steps:['Менеджер разбирает письмо','Вводит артикул для агента','Агент подставляет остаток из 1С','Менеджер уточняет дату','Агент пишет черновик КП'],
   title:'Черновик готов. Обещать пятницу пока может только менеджер.',
   result:'На входе сотрудник уточнил артикул. На выходе он проверяет резерв, подтверждает доставку у логиста и только потом отправляет предложение.'},
  {steps:['Агент читает заявку','Находит артикул по справочнику','Вычитает действующие резервы','Проверяет срок перевозчика','Отправляет подтверждённое КП'],
   title:'По типовому заказу клиент получает ответ без ожидания менеджера.',
   result:'Продажи и склад согласовали справочник и правила резерва. Логистика определила источник срока. Если артикул однозначен, товар свободен и перевозчик подтвердил пятницу, агент отправляет КП сам. Если дата неизвестна, запрос уходит логисту.'}
 ];
 function showMode(index){
  const mode=modes[index];
  buttons.forEach((button,i)=>button.setAttribute('aria-pressed',String(i===index)));
  app.querySelector('.journey').dataset.after=String(index===2);
  const track=app.querySelector('.route-track');
  track.replaceChildren();
  mode.steps.forEach((description,i)=>{
   const step=document.createElement('li');
   if((index===0 && i>0)||(index===1 && [1,3].includes(i)))step.className='waiting';
   const marker=document.createElement('span');
   marker.className='node-dot';
   marker.setAttribute('aria-hidden','true');
   marker.textContent=index===2?'✓':String(i+1);
   const title=document.createElement('h3');
   title.textContent=stageNames[i];
   const text=document.createElement('p');
   text.textContent=description;
   step.append(marker,title,text);
   track.append(step);
  });
  const lead=document.createElement('strong');
  lead.textContent=mode.title;
  app.querySelector('.reply').replaceChildren(lead,document.createTextNode(mode.result));
 }
 buttons.forEach((button,i)=>button.addEventListener('click',()=>showMode(i)));
 showMode(0);
}
function crumbs(links){return '<div class="crumb">'+links.join(' &nbsp;›&nbsp; ')+'</div>'}
const topLink='<a href="#goals">Бизнес-цели</a>';
function goalPage(g){
 const item=goals[g];
 app.innerHTML='<section class="inner">'+crumbs([topLink,item.title])+'<h1>'+item.title+'</h1><p class="lead">Выберите ситуацию, которая ближе к вашей работе.</p><div class="grid">'+item.cases.map((c,i)=>tile('case/'+g+'/'+i,c[0],c[1],industries[i])).join('')+'</div></section>';
}
function relatedWork(goal,industry){
 const links={
  '1/0':['work-catalog','Подбор товара по автомобилю в «Автопульсе»'],
  '2/0':['work-proposal','Как мини-CRM собирает предложение для клиента'],
  '3/1':['work-1c','Как на производстве проверяют решения агента в 1С']
 };
 const link=links[goal+'/'+industry];
 return link ? '<p class="related">Пример нашей работы · <a href="#'+link[0]+'">'+link[1]+' →</a></p>' : '';
}
function casePage(g,i){
 const c=goals[g].cases[i],audit=auditExamples[g][i];
 const rows=[['Как сейчас',audit[0]],['Что меняем по итогам аудита',audit[1]],['Как работает агент',c[2]],['Чем измерить результат',c[3]]];
 app.innerHTML='<article class="inner">'+crumbs([topLink,'<a href="#goal/'+g+'">'+goals[g].title+'</a>',industries[i]])+'<p class="eyebrow">Учебный сценарий · '+industries[i]+'</p><h1>'+c[0]+'</h1><dl class="rows">'+rows.map(([k,v])=>'<div class="row"><dt>'+k+'</dt><dd>'+v+'</dd></div>').join('')+'</dl>'+relatedWork(g,i)+'<a class="cta" href="#brief/'+g+'/'+i+'">Разобрать похожую задачу →</a></article>';
}
function brief(g,i){
 const context=goals[g]?.cases[i]?goals[g].title+' / '+industries[i]+' / '+goals[g].cases[i][0]:'Аудит процесса';
 app.innerHTML='<section class="inner">'+crumbs([topLink,'Подготовка к аудиту'])+'<h1>Опишите один процесс</h1><p class="lead">'+context+'</p><form class="brief"><label>Что сейчас требует ручной работы?<textarea name="task" required rows="3" placeholder="Вспомните один недавний заказ"></textarea></label><label>Какой результат вы хотите получить?<textarea name="result" rows="2" placeholder="Например, подтвердить срок без звонка логисту"></textarea></label><p>Описание сохранится текстовым файлом на вашем устройстве для обсуждения с командой.</p><button class="cta">Скачать описание задачи</button></form></section>';
 const form=app.querySelector('form');
 form.onsubmit=e=>{e.preventDefault();const input=new FormData(form);const content=[context,input.get('task'),input.get('result')].join('\n\n');const url=URL.createObjectURL(new Blob(['\ufeff',content],{type:'text/plain;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='Задача для аудита.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};
}
function route(){
 const [path,goalId,industryId]=location.hash.slice(1).split('/');
 const validGoal=/^[0-3]$/.test(goalId),validIndustry=/^[01]$/.test(industryId);
 if(path==='goal'&&validGoal)goalPage(Number(goalId));
 else if(path==='case'&&validGoal&&validIndustry)casePage(Number(goalId),Number(industryId));
 else if(path==='brief')brief(validGoal?Number(goalId):-1,validIndustry?Number(industryId):-1);
 else home();
 document.title=app.querySelector('h1').textContent+' · ИИ для бизнеса';
 if(path==='app')app.focus({preventScroll:true});
 if(['goals','audit','works','work-catalog','work-proposal','work-1c'].includes(path))document.getElementById(path).scrollIntoView();
 else window.scrollTo(0,0);
}
window.addEventListener('hashchange',()=>{route();app.focus({preventScroll:true})});route();
</script></body></html>
